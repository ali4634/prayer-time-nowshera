<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نوشہرہ — اوقاتِ نماز</title>
<meta name="theme-color" content="#0B1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اوقاتِ نماز">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2220%27 fill=%27%230B1626%27/%3E%3Cpath d=%27M62 20a32 32 0 1 0 18 58 26 26 0 1 1-18-58z%27 fill=%27%23E3B23C%27/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%230B1626%27/%3E%3Cpath d=%27M62 20a32 32 0 1 0 18 58 26 26 0 1 1-18-58z%27 fill=%27%23E3B23C%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0B1626;
    --bg-2:#101F35;
    --card:#132A42;
    --card-2:#0F2236;
    --line:rgba(227,178,60,0.16);
    --gold:#E3B23C;
    --gold-dim:#B9902E;
    --cream:#F2ECDC;
    --muted:#8FA3BC;
    --sehri:#5FA8D3;
    --iftar:#E3814A;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-1:#0B1626; --bg-2:#101F35; --card:#132A42; --card-2:#0F2236;
      --cream:#F2ECDC; --muted:#8FA3BC;
    }
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -10%, #1a3350 0%, transparent 60%),
      linear-gradient(180deg,var(--bg-1),var(--bg-2) 60%, var(--bg-1));
    color:var(--cream);
    font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu",system-ui,sans-serif;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 48px;}

  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand .kicker{
    font-family:"Noto Nastaliq Urdu",serif;
    color:var(--gold);
    font-size:15px;
    letter-spacing:0.5px;
    margin-bottom:2px;
  }
  .brand h1{
    font-family:"Noto Nastaliq Urdu",serif;
    font-weight:700;
    font-size:30px;
    margin:2px 0 4px;
    line-height:1.5;
  }
  .brand .sub{
    color:var(--muted);
    font-size:13px;
  }

  .moonrow{display:flex;justify-content:center;margin:6px 0 14px;opacity:0.9;}

  .datebar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .datebar button{
    background:none;border:none;color:var(--gold);font-size:20px;
    width:36px;height:36px;border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .datebar button:active{background:rgba(227,178,60,0.12);}
  .datebar .center{text-align:center;flex:1;}
  .datebar .g-date{font-size:15px;font-weight:600;color:var(--cream);}
  .datebar .g-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .today-pill{
    display:inline-block;margin-top:6px;font-size:11px;color:var(--gold);
    border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;
    background:rgba(227,178,60,0.06);
  }

  .cardlist{display:flex;flex-direction:column;gap:9px;}
  .row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 16px;
  }
  .row .r-left{display:flex;align-items:center;gap:12px;}
  .row .icon{
    width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(227,178,60,0.10);
    flex-shrink:0;
  }
  .row .icon svg{width:19px;height:19px;}
  .row .names{display:flex;flex-direction:column;}
  .row .name-ur{font-family:"Noto Nastaliq Urdu",serif;font-size:18px;line-height:1.4;}
  .row .name-note{font-size:11px;color:var(--muted);margin-top:1px;}
  .row .time{
    font-size:19px;font-weight:600;letter-spacing:0.3px;
    font-variant-numeric:tabular-nums;
    direction:ltr;
  }
  .row.sehri{border-color:rgba(95,168,211,0.35);}
  .row.sehri .icon{background:rgba(95,168,211,0.14);}
  .row.iftar{border-color:rgba(227,129,74,0.35);}
  .row.iftar .icon{background:rgba(227,129,74,0.14);}
  .row.hilite .time{color:var(--gold);}

  .asr-toggle{
    display:flex;gap:8px;margin:16px 0 6px;
    background:var(--card-2);border:1px solid var(--line);
    border-radius:14px;padding:5px;
  }
  .asr-toggle button{
    flex:1;border:none;background:none;color:var(--muted);
    font-family:"Noto Naskh Arabic",serif;font-size:14px;
    padding:9px 6px;border-radius:10px;cursor:pointer;
  }
  .asr-toggle button.active{background:var(--gold);color:#1a1305;font-weight:600;}

  .section-title{
    margin:26px 0 10px;font-family:"Noto Nastaliq Urdu",serif;
    color:var(--gold);font-size:17px;text-align:center;
  }

  details.month-panel{
    background:var(--card-2);border:1px solid var(--line);border-radius:14px;
    padding:2px 14px; margin-bottom:60px;
  }
  details.month-panel summary{
    padding:12px 0;cursor:pointer;color:var(--cream);font-size:14.5px;
    list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  details.month-panel summary::-webkit-details-marker{display:none;}
  summary .chev{color:var(--gold);transition:transform .2s;}
  details[open] summary .chev{transform:rotate(180deg);}

  select{
    width:100%;background:var(--card);color:var(--cream);
    border:1px solid var(--line);border-radius:10px;padding:10px;
    font-family:inherit;font-size:14px;margin-bottom:12px;
  }

  .mtable-wrap{overflow-x:auto;padding-bottom:10px;}
  table.mtable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px;}
  table.mtable th, table.mtable td{
    padding:7px 6px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);
    font-variant-numeric:tabular-nums;
  }
  table.mtable th{color:var(--gold);font-weight:600;font-size:11.5px;font-family:"Noto Naskh Arabic",serif;}
  table.mtable td.day-cell{color:var(--muted);}
  table.mtable tr.is-today td{background:rgba(227,178,60,0.10);}
  table.mtable tr.is-today td.day-cell{color:var(--gold);font-weight:700;}

  footer{
    text-align:center;color:var(--muted);font-size:11px;margin-top:30px;line-height:1.9;
  }
  footer .src{color:var(--gold-dim);}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="kicker">دائمی نقشہ اوقاتِ نماز، سحر و افطار</div>
    <h1>نوشہرہ و مضافات</h1>
    <div class="sub">ضلع نوشہرہ، خیبر پختونخوا</div>
  </div>

  <div class="moonrow">
    <svg width="26" height="26" viewBox="0 0 100 100"><path d="M62 8a42 42 0 1 0 22 76 34 34 0 1 1-22-76z" fill="#E3B23C"/></svg>
  </div>

  <div class="datebar">
    <button id="prevDay" aria-label="پچھلا دن">›</button>
    <div class="center">
      <div class="g-date" id="gDate">—</div>
      <div class="g-sub" id="hDate">—</div>
      <div class="today-pill" id="todayBtn">آج</div>
    </div>
    <button id="nextDay" aria-label="اگلا دن">‹</button>
  </div>

  <div class="cardlist" id="cardlist"></div>

  <div class="asr-toggle">
    <button id="asrHanafi" class="active">عصر — حنفی</button>
    <button id="asrShafi">عصر — شافعی</button>
  </div>

  <div class="section-title">مہینے کا مکمل نقشہ</div>
  <details class="month-panel" id="monthPanel">
    <summary>مکمل جدول دیکھیں <span class="chev">▾</span></summary>
    <select id="monthSelect"></select>
    <div class="mtable-wrap">
      <table class="mtable">
        <thead>
          <tr>
            <th>تاریخ</th><th>صبح صادق</th><th>طلوع</th><th>ظہر</th>
            <th>عصر حنفی</th><th>عصر شافعی</th><th>مغرب</th><th>عشاء</th>
          </tr>
        </thead>
        <tbody id="monthBody"></tbody>
      </table>
    </div>
  </details>

  <footer>
    ماخذ: مصدقہ مفتی محمد یوسف تاجانویؒ<br>
    <span class="src">مرتبہ: پروفیسر عبداللطیف بن عبدالعزیز — مکتبہ خالد و عابد</span>
  </footer>

</div>

let asrMode = "hanafi"; // hanafi index 4, shafi index 3
let viewMonth, viewDay;

function daysInMonth(mIdx){ return DATA[mIdx].length; }

function todayParts(){
  const d = new Date();
  return {m:d.getMonth(), d:d.getDate()};
}

function clampDay(mIdx, day){
  const max = daysInMonth(mIdx);
  if(day < 1) return {m: (mIdx+11)%12, d: daysInMonth((mIdx+11)%12)};
  if(day > max) return {m: (mIdx+1)%12, d: 1};
  return {m: mIdx, d: day};
}

function fmtTime(t){
  // t like "5:46" -> "05:46 ق.د." style with AM/PM guess based on prayer index handled by caller
  return t;
}

function to12(t, isPM){
  let [h,m] = t.split(":").map(Number);
  let suffix = isPM ? "شام" : "صبح";
  return {h, m, suffix};
}

const ROW_DEFS = [
  {key:"fajr", idx:0, label:"سحری / فجر", note:"صبح صادق", pm:false, cls:"sehri", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#E3B23C" stroke-width="1.6"><path d="M12 3v3M4.2 6.2l2 2M19.8 6.2l-2 2M3 14h1M20 14h1M6 14a6 6 0 0 1 12 0"/><path d="M4 18h16" stroke-linecap="round"/></svg>'},
  {key:"sunrise", idx:1, label:"طلوعِ آفتاب", note:"", pm:false, cls:"", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#E3B23C" stroke-width="1.6"><circle cx="12" cy="14" r="4"/><path d="M12 3v3M4 18h16M2 22h20M5 9l2 2M19 9l-2 2"/></svg>'},

  {key:"isha", idx:6, label:"عشاء", note:"", pm:true, cls:"", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#E3B23C" stroke-width="1.6"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'},
];

function render(){
  const dayArr = DATA[viewMonth][viewDay-1];
  const gDate = document.getElementById("gDate");
  const hDate = document.getElementById("hDate");
  gDate.textContent = viewDay + " " + MONTH_NAMES[viewMonth];
  const t = todayParts();
  hDate.textContent = (viewMonth===t.m && viewDay===t.d) ? "آج کی تاریخ" : "تاریخ منتخب کریں یا آگے پیچھے جائیں";

  const list = document.getElementById("cardlist");
  list.innerHTML = "";
  ROW_DEFS.forEach(def=>{
    let timeVal;
    if(def.key==="asr"){
      timeVal = dayArr[asrMode==="hanafi"?4:3];
    } else {
      timeVal = dayArr[def.idx];
    }
    const row = document.createElement("div");
    row.className = "row " + def.cls;
    row.innerHTML = `
      <div class="r-left">
        <div class="icon">${def.icon}</div>
        <div class="names">
          <div class="name-ur">${def.label}</div>
          ${def.note? `<div class="name-note">${def.note}</div>`:""}
        </div>
      </div>
      <div class="time">${timeVal}</div>
    `;
    list.appendChild(row);
  });

  document.getElementById("asrHanafi").classList.toggle("active", asrMode==="hanafi");
  document.getElementById("asrShafi").classList.toggle("active", asrMode==="shafi");

  renderMonthTable();
}

function renderMonthTable(){
  const sel = document.getElementById("monthSelect");
  if(sel.options.length===0){
    MONTH_NAMES.forEach((n,i)=>{
      const o = document.createElement("option");
      o.value=i; o.textContent=n;
      sel.appendChild(o);
    });
  }
  sel.value = viewMonth;
  const body = document.getElementById("monthBody");
  body.innerHTML = "";
  const t = todayParts();
  DATA[viewMonth].forEach((row,i)=>{
    const tr = document.createElement("tr");
    if(viewMonth===t.m && (i+1)===t.d) tr.className="is-today";
    tr.innerHTML = `<td class="day-cell">${i+1}</td><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[4]}</td><td>${row[3]}</td><td>${row[5]}</td><td>${row[6]}</td>`;
    body.appendChild(tr);
  });
}

document.getElementById("prevDay").addEventListener("click", ()=>{
  const r = clampDay(viewMonth, viewDay-1);
  viewMonth=r.m; viewDay=r.d; render();
});
document.getElementById("nextDay").addEventListener("click", ()=>{
  const r = clampDay(viewMonth, viewDay+1);
  viewMonth=r.m; viewDay=r.d; render();
});
document.getElementById("todayBtn").addEventListener("click", ()=>{
  const t = todayParts();
  viewMonth=t.m; viewDay=Math.min(t.d, daysInMonth(t.m)); render();
});
document.getElementById("asrHanafi").addEventListener("click", ()=>{ asrMode="hanafi"; render(); });
document.getElementById("asrShafi").addEventListener("click", ()=>{ asrMode="shafi"; render(); });
document.getElementById("monthSelect").addEventListener("change", (e)=>{
  viewMonth = parseInt(e.target.value,10);
  viewDay = Math.min(viewDay, daysInMonth(viewMonth));
  render();
});

(function init(){
  const t = todayParts();
  viewMonth = t.m; viewDay = Math.min(t.d, daysInMonth(t.m));
  render();
})();
